<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Search</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; }
    input[name=q] { flex: 1 1 12rem; }
    input, select, button { font: inherit; padding: .4rem; }
    ul { list-style: none; padding: 0; }
    li { padding: .75rem 0; border-bottom: 1px solid #ddd; }
    .meta { color: #666; font-size: .9rem; }
    .editions { margin: .4rem 0 0 1rem; font-size: .9rem; }
    .editions li { padding: .15rem 0; border: 0; }
    button.edition { font-size: inherit; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
    button.edition:hover { text-decoration: underline; }
    dialog { width: min(40rem, calc(100% - 2rem)); box-sizing: border-box; }
    dialog h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    .table-scroll { overflow-x: auto; margin: 1rem 0; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { text-align: left; padding: .3rem .5rem .3rem 0; border-bottom: 1px solid #ddd; }
    #others { margin-top: 1.5rem; color: #666; }
    li details { margin: .2rem 0 0 1rem; font-size: .9rem; color: #666; }
    summary { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Library Search</h1>
  <form id="search-form">
    <input name="q" type="search" placeholder="Search the catalogue" required>
    <select name="index">
      <option value="any">Everything</option>
      <option value="title">Title</option>
      <option value="author">Author</option>
      <option value="subject">Subject</option>
      <option value="isbn">ISBN</option>
    </select>
    <select name="format">
      <option value="book">Book</option>
      <option value="ebook">eBook</option>
      <option value="audiobook">Audiobook</option>
      <option value="film">Film</option>
      <option value="music">Music</option>
      <option value="score">Score</option>
    </select>
    <button>Search</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="results"></ul>
  <details id="others" hidden></details>
  <dialog id="edition-dialog"></dialog>
  <script src="app.js"></script>
</body>
</html>
